<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Select Profile — Campus Book Trading</title>
  <link rel="stylesheet" href="assets/css/auth.css">
</head>

<body class="auth-body">

<div class="auth-card">
  <h2 class="auth-title">Complete Your Profile</h2>
  <p class="auth-sub">Join your university community</p>

  <form id="profileForm">

    <label>School</label>
    <select id="school" required></select>

    <label>College / Faculty</label>
    <select id="college" required></select>

    <label>Major / Program</label>
    <select id="major" required></select>

    <label>Grade</label>
    <select id="grade" required></select>

    <button class="btn-primary" type="submit">Enter Community</button>
  </form>
</div>

<script src="assets/js/auth.js"></script>
</body>
</html>
